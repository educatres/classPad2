<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>學生白板｜ClassPad</title><link rel="stylesheet" href="./src/styles/app.css"></head><body class="board-page">
<header class="board-header"><div><strong id="studentName">正在開啟白板…</strong><span id="seatNumber" class="muted"></span></div><nav class="board-page-controls" aria-label="白板翻頁"><button id="studentPrevPage" disabled class="ghost" type="button">上一頁</button><strong id="studentPageLabel">第 1 / 1 頁</strong><button id="studentNextPage" disabled class="ghost" type="button">下一頁</button></nav><div class="status-row"><span id="lockBadge" class="badge" hidden>已鎖定</span><span id="connectionBadge" class="badge">連線中</span><span id="syncBadge" class="badge">準備中</span></div></header>
<div id="studentToolbar" class="board-toolbar" hidden>
<div class="pen-color-group" role="group" aria-label="畫筆顏色">
<button type="button" data-tool="pen" data-pen-color="#000000" class="pen-color active" style="--pen-color:#000000" aria-label="黑色畫筆" title="黑色畫筆" aria-pressed="true"></button>
<button type="button" data-tool="pen" data-pen-color="#2563eb" class="pen-color" style="--pen-color:#2563eb" aria-label="藍色畫筆" title="藍色畫筆" aria-pressed="false"></button>
<button type="button" data-tool="pen" data-pen-color="#16a34a" class="pen-color" style="--pen-color:#16a34a" aria-label="綠色畫筆" title="綠色畫筆" aria-pressed="false"></button>
</div><button data-tool="pan" aria-label="拖動畫板" aria-pressed="false" title="按住滑鼠左鍵或單指拖動畫板">☝<span>拖動</span></button><button data-tool="eraser" aria-label="橡皮擦" aria-pressed="false">⌫<span>橡皮擦</span></button><button id="textToolBtn" data-mode="text" aria-label="文字作答" aria-pressed="false">T<span>文字</span></button><div class="zoom-controls" role="group" aria-label="白板縮放"><button id="studentZoomOut" type="button" aria-label="縮小白板，每次 10%">− 縮小</button><output id="studentZoomScale" aria-label="目前白板縮放比例" aria-live="polite">100%</output><button id="studentZoomIn" type="button" aria-label="放大白板，每次 10%">＋ 放大</button><button id="resetZoomBtn" type="button" aria-label="重設白板視圖，恢復 100% 並置中">重設視圖</button></div>
<label class="brush-size-tool">筆刷<select id="widthInput" aria-label="畫筆粗細"><option value="1">極細</option><option value="3">細</option><option value="5" selected>中</option></select></label><button id="undoBtn" aria-label="復原">復原</button><button id="redoBtn" aria-label="重做">重做</button><button id="studentSmoothing" class="active" type="button" aria-pressed="true" aria-label="關閉手寫平滑"><span>平滑：開</span></button></div>
<div id="newMaterialNotice" class="new-material-notice" role="status" hidden><span></span><button type="button">開啟題目</button></div><main id="boardShell" class="board-shell"><div id="boardMessage" class="board-message">正在驗證專屬連結…</div><div id="boardStage" class="board-stage" hidden><canvas id="backgroundCanvas"></canvas><div id="studentBackgroundLayer" class="background-image-layer"><img id="studentBackgroundImage" class="board-background-image" alt="老師分享的題目底圖" hidden></div><canvas id="studentCanvas"></canvas><div id="studentTextLayer" class="student-text-layer"></div><canvas id="teacherCanvas" class="readonly-layer"></canvas><div id="studentStickyLayer" class="sticky-layer" aria-label="老師便條貼"></div></div></main>
<div id="toast" class="toast" role="status"></div><script type="module" src="./src/pages/student.js"></script></body></html>
