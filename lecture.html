<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>老師講解白板｜ClassPad</title><link rel="stylesheet" href="./src/styles/app.css"></head>
<body class="board-page lecture-page">
  <header class="board-header lecture-header">
    <div><strong id="classTitle">老師講解白板</strong><span class="muted">請在會議軟體分享此視窗</span></div>
    <nav aria-label="課堂導覽"><a id="teacherLink" class="button-link" href="#">課堂設定</a><a id="monitorLink" class="button-link" href="#">學生畫面</a></nav>
    <div class="status-row"><span id="connectionBadge" class="badge">連線中</span><span id="syncBadge" class="badge" role="status" aria-live="polite">準備中</span><button id="retrySync" type="button" hidden>重試保存</button></div>
  </header>
  <div id="lectureToolbar" class="board-toolbar compact-toolbar" role="toolbar" aria-label="老師講解工具，可左右滑動" tabindex="0" hidden>
    <button id="lecturePdfToggle" class="primary" data-icon="pdf" aria-label="PDF 題目派送" aria-expanded="false" aria-controls="lecturePdfPanel">PDF</button>
    <div class="pen-color-group" role="group" aria-label="畫筆顏色">
      <button type="button" data-tool="pen" data-pen-color="#000000" class="pen-color active" style="--pen-color:#000000" aria-label="黑色畫筆" title="黑色畫筆" aria-pressed="true"></button>
      <button type="button" data-tool="pen" data-pen-color="#2563eb" class="pen-color" style="--pen-color:#2563eb" aria-label="藍色畫筆" title="藍色畫筆" aria-pressed="false"></button>
      <button type="button" data-tool="pen" data-pen-color="#16a34a" class="pen-color" style="--pen-color:#16a34a" aria-label="綠色畫筆" title="綠色畫筆" aria-pressed="false"></button>
      <button type="button" data-tool="pen" data-pen-color="#ef4444" class="pen-color" style="--pen-color:#ef4444" aria-label="紅色畫筆" title="紅色畫筆" aria-pressed="false"></button>
    </div><button data-tool="pan" data-icon="pan" aria-pressed="false" aria-label="拖動畫板" title="按住滑鼠左鍵或單指拖動畫板">拖動</button><button data-tool="eraser" data-icon="eraser" aria-label="整筆橡皮擦" aria-pressed="false">擦除</button>
    <label class="brush-size-tool" title="畫筆粗細"><span data-icon="width" aria-hidden="true"></span><select id="lectureWidth" aria-label="畫筆粗細"><option value="1">極細</option><option value="3">細</option><option value="5" selected>中</option><option value="8">粗</option><option value="12">很粗</option><option value="20">特粗</option><option value="40">40 px</option></select></label>
    <button id="lectureSmoothing" class="active" data-icon="smoothing" aria-label="關閉手寫平滑" aria-pressed="true">平滑</button><button id="lectureUndo" data-icon="undo">復原</button><button id="lectureRedo" data-icon="redo">重做</button><button id="lectureClear" data-icon="clear" aria-label="清除本頁" class="danger-outline">清除</button>
    <div class="zoom-controls" role="group" aria-label="白板縮放"><button id="lectureZoomOut" data-icon="minus" aria-label="縮小白板，每次 10%">縮小</button><output id="lectureZoomScale" aria-label="目前白板縮放比例" aria-live="polite">100%</output><button id="lectureZoomIn" data-icon="plus" aria-label="放大白板，每次 10%">放大</button><button id="lectureResetZoom" data-icon="reset" aria-label="重設白板視圖，恢復 100% 並置中">重設</button></div>
    <nav class="board-page-controls" aria-label="講解白板翻頁"><button id="lecturePrevPage" data-icon="prev" aria-label="上一頁">上頁</button><strong id="lecturePageLabel">…</strong><button id="lectureNextPage" data-icon="next" aria-label="下一頁">下頁</button><button id="lectureAddPage" data-icon="addPage" aria-label="新增講解頁" class="primary">新增</button></nav>
  </div>
  <div id="lectureWorkspace" class="lecture-workspace">
    <aside id="lecturePdfPanel" class="pdf-panel" aria-label="PDF 題目派送面板" hidden><p class="pdf-empty" role="status">正在載入 PDF 工具…</p></aside>
    <div id="lecturePdfSplitter" class="pdf-splitter" role="separator" tabindex="0" aria-label="調整 PDF 面板寬度，可使用左右方向鍵" aria-orientation="vertical" aria-controls="lecturePdfPanel" hidden></div>
    <main class="board-shell"><div id="lectureMessage" class="board-message" role="status">正在驗證老師權限…</div><div id="lectureStage" class="board-stage" hidden><canvas id="lectureBackground"></canvas><div id="lectureBackgroundLayer" class="background-image-layer"><img id="lectureBackgroundImage" class="board-background-image" alt="PDF 派送的講解題目底圖" hidden></div><canvas id="lectureStudent" class="readonly-layer"></canvas><canvas id="lectureTeacher"></canvas></div></main>
  </div>
  <div id="toast" class="toast" role="status"></div><script type="module" src="./src/pages/lecture.js"></script>
</body></html>
